name: Release

# Creates a git tag from pubspec.yaml's version on manual dispatch.
# No secrets required: the tag is pushed with the default GITHUB_TOKEN,
# then build.yml is triggered explicitly via workflow_dispatch (which
# GITHUB_TOKEN *is* allowed to trigger — unlike push events).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # needed to trigger build.yml via workflow_dispatch

jobs:
  create-tag:
    # Only tag from the default branch, so a dispatch from a feature
    # branch can't create a release tag by accident.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      # Default shallow clone is enough: we only tag HEAD.
      - uses: actions/checkout@v7

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          LINE=$(grep -E '^version:[[:space:]]*' pubspec.yaml)
          RAW=${LINE#*:}
          # strip leading/trailing whitespace
          RAW=$(echo "$RAW" | xargs)
          VERSION=$(printf '%s' "$RAW" | cut -d+ -f1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          echo "Creating tag: ${TAG}"

          # Guard: never clobber an existing tag
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists on remote"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Trigger Build workflow
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          echo "Triggering build.yml for tag ${TAG}"
          # GITHUB_TOKEN CAN trigger workflow_dispatch (unlike push events)
          gh workflow run build.yml --ref "${TAG}" --repo "${REPO}"