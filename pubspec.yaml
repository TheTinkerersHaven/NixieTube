name: nixietube
description: "NixieTube - Material 3 Expressive YouTube Music desktop client."
publish_to: 'none'
version: 0.3.1+17

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # InnerTube / Data API HTTP client.
  dio: ^5.0.0
  # SHA-1 for SAPISIDHASH derivation and artwork cache digests.
  crypto: ^3.0.8
  # Central AppState wiring (mirrors StateFlow collectAsState).
  provider: ^6.1.0
  image: ^4.10.1
  # Motion controllers behind m3e_core's springs; the local
  # downward FAB menu drives them directly.
  motor: ^1.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  dbus: ^0.8.0
  # Discord Rich Presence is a pure-Dart IPC client (lib/sys/discord_ipc.dart),
  # so there is no RPC SDK dependency and no Rust/native bridge.
  # 1.8.0 exports a RoundedPolygon that clashes with m3e_core's own
  # (both names are visible to m3e_core's loading indicator), so the app
  # stays on 1.7.x until m3e_core catches up.
  material_ui: ^1.9.0
  # Loading skeletons for the home feed (replaces the spinner while shelves
  # resolve, so the layout is stable and content reveals in place).
  skeletonizer: ^3.0.0
  m3e_core: ^1.1.4
  # Credentials live in the platform secret store (libsecret on Linux)
  # instead of a plain-text file.
  flutter_secure_storage: ^11.2.0
  # System accent (Material You) color schemes: the desktop
  # accent via XDG portal/GTK on Linux, wallpaper colors on
  # Android. Only DynamicColorBuilder is used; seed schemes
  # come from flutter itself.
  dynamic_color: ^2.1.0
  google_fonts: ^9.0.0
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  # Embedded Google-login window (system WebKit). Vendored path fork —
  # see packages/desktop_webview_window/VENDORED.md for the native
  # NULL-deref crash fixes that upstream 0.3.0 lacks.
  desktop_webview_window:
    path: packages/desktop_webview_window
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The app logo, shown in the first-run setup.
    - assets/icon/nixietube.png
