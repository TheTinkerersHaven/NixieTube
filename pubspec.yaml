name: nixietube
description: "NixieTube - Material 3 Expressive YouTube Music desktop client."
publish_to: 'none'
version: 0.4.3+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # InnerTube / Data API HTTP client.
  dio: ^5.11.1
  # SHA-1 for SAPISIDHASH derivation and artwork cache digests.
  crypto: ^3.0.8
  # Structured logging to console and a rotating file.
  logger: ^2.8.0
  # Central AppState wiring (mirrors StateFlow collectAsState).
  provider: ^6.1.5+1
  image: ^4.12.0
  # Motion controllers behind m3e_core's springs; the local
  # downward FAB menu drives them directly.
  motor: ^1.1.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  dbus: ^0.8.0
  material_ui: ^1.10.0
  # Loading skeletons for the home feed (replaces the spinner while shelves
  # resolve, so the layout is stable and content reveals in place).
  skeletonizer: ^3.0.0
  m3e_core: ^1.1.5
  # Credentials live in the platform secret store (libsecret on Linux)
  # instead of a plain-text file.
  flutter_secure_storage: ^11.2.0
  # System accent (Material You) color schemes: the desktop
  # accent via XDG portal/GTK on Linux, wallpaper colors on
  # Android. Only DynamicColorBuilder is used; seed schemes
  # come from flutter itself.
  dynamic_color: ^2.1.0
  google_fonts: ^9.0.0
  tray_manager: ^0.8.3
  window_manager: ^0.6.0
  # window_manager's native API re-exports the window surface but not the
  # application-level one; the tray sets the window icon through Application.
  nativeapi: ^0.5.10
  # Embedded Google-login window (system WebKit).
  desktop_webview_window: ^0.4.2
  silky_scroll: ^2.6.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The app logo, shown in the first-run setup.
    - assets/icon/nixietube.png
    # Local Google Sans Flex variable font (ROND axis available).
    - assets/fonts/GoogleSansFlex-VariableFont_ROND,opsz,slnt,wdth,wght.ttf
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: "assets/fonts/GoogleSansFlex-VariableFont_ROND,opsz,slnt,wdth,wght.ttf"
